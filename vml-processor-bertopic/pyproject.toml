[project]
name = "vml-processor-bertopic"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bertopic>=0.17.4",
    "dagster>=1.13.24",
    "dagster-docker==0.29.24",
    "dagster-postgres==0.29.24",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.0.54,<2.1",
    "structlog>=26.1.0",
    "tokenizers>=0.23.2",
]

[dependency-groups]
dev = [
    "dagster-dg-cli>=1.13.24",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "nbformat>=5.11.1",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: real BERTopic fit on a synthetic corpus; deselect with -m 'not slow'",
]
