storage:
  postgres:
    postgres_db:
      hostname: postgres
      username: dagster
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name: dagster
      port: 5432

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 4

# Each run uses the image advertised by its code location.
run_launcher:
  module: dagster_docker
  class: DockerRunLauncher
  config:
    env_vars:
      - DAGSTER_POSTGRES_PASSWORD
    network: dagster_default
    container_kwargs:
      volumes:
        - dagster_dagster_storage:/opt/dagster/storage
      labels:
        deployment: vml-dagster
      log_config:
        type: json-file
        config:
          max-size: 10m
          max-file: "3"

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/storage/compute_logs

local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster/storage

telemetry:
  enabled: false
