# Install as /etc/wireguard/wg0.conf on blanco after replacing key placeholders.
[Interface]
Address = 10.255.2.2/32
PrivateKey = <BLANCO_PRIVATE_KEY>

[Peer]
# vml.pub
PublicKey = <VML_PUBLIC_KEY>
Endpoint = vml.pub:51820
AllowedIPs = 10.255.2.1/32
# Maintain the NAT mapping so vml can initiate connections to blanco.
PersistentKeepalive = 25
