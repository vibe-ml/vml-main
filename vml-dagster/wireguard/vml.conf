# Install as /etc/wireguard/wg0.conf on vml.pub after replacing key placeholders.
[Interface]
Address = 10.255.2.1/32
ListenPort = 51820
PrivateKey = <VML_PRIVATE_KEY>

[Peer]
# blanco: learn its endpoint from authenticated incoming packets.
PublicKey = <BLANCO_PUBLIC_KEY>
AllowedIPs = 10.255.2.2/32
