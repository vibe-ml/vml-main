# Social crawler overlay for vml; install as /opt/dagster/projects/vml-crawler-social/compose.yaml.
# Paths resolve relative to /opt/dagster/compose.yaml.
services:
  code_social:
    restart: unless-stopped
    image: ${SOCIAL_IMAGE:?Social image is required}
    build:
      context: ./projects/vml-crawler-social
    environment:
      # Schedule evaluation reconstructs the Dagster instance in this process.
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:?Database password is required}
      DAGSTER_CURRENT_IMAGE: ${SOCIAL_IMAGE:?Social image is required}
      DAGSTER_CONTAINER_CONTEXT: >-
        {"docker": {
          "env_vars": ["SOCIAL_DATABASE_URL", "SOCIAL_SCHEMA_SOCIAL",
            "SOCIAL_OPENALEX_SCHEMA_RAW", "SOCIAL_COLLECT_FROM", "SOCIAL_TOPIC_LIMIT",
            "SOCIAL_TOPIC_IDS", "SOCIAL_EXCLUDED_TERMS", "SOCIAL_PLATFORMS",
            "SOCIAL_STACKEXCHANGE_SITES", "SOCIAL_STACKEXCHANGE_KEY",
            "SOCIAL_BLUESKY_HANDLE", "SOCIAL_BLUESKY_APP_PASSWORD",
            "SOCIAL_REQUEST_BUDGET", "SOCIAL_WINDOW_CAP"],
          "networks": ["pg_default"],
          "container_kwargs": {"mem_limit": "1g", "nano_cpus": 1000000000}
        }}
    env_file:
      - ./configs/vml-crawler-social.env
      - ./secrets/vml-crawler-social.env
    networks:
      - default
      - social_database
    healthcheck:
      test: [CMD, dagster, api, grpc-health-check, -p, "4000"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  daemon:
    env_file:
      - ./configs/vml-crawler-social.env
      - ./secrets/vml-crawler-social.env
    depends_on:
      code_social:
        condition: service_healthy

  webserver:
    env_file:
      - ./configs/vml-crawler-social.env
      - ./secrets/vml-crawler-social.env

networks:
  social_database:
    external: true
    name: pg_default
