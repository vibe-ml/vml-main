[project]
name = "vml-crawler-social"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "dagster>=1.13.24",
    "dagster-postgres>=0.29.24",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    # Dagster 1.13 PostgreSQL notifications require the pre-2.1 default driver.
    "sqlalchemy>=2.0.54,<2.1",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
extend-select = ["E501"]
# Windows bind mounts mark every file executable.
ignore = ["EXE002"]

[tool.ruff.lint.per-file-ignores]
"src/models/*" = ["RUF012"]
