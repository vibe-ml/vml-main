[project]
name = "vml-crawler-openalex"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "dagster>=1.13.24",
    "dagster-postgres>=0.29.24",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.54",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]
