name: qdrant
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1-unprivileged
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: "2.0"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./storage:/qdrant/storage
      - ./snapshots:/qdrant/snapshots
      - ./config.yaml:/qdrant/config/production.yaml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
